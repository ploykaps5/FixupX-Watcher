name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-windows.txt
      - run: pyinstaller Fixup2X-windows.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: dist/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgirepository1.0-dev \
              gir1.2-appindicator3-0.1 libappindicator3-1
      - run: pip install -r requirements-linux.txt
      - run: pyinstaller Fixup2X-linux.spec --noconfirm
      - name: Переименовать и упаковать
        run: |
          mkdir -p release
          cp dist/fixupx-watcher release/fixup2x-linux-amd64
          chmod +x release/fixup2x-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: release/fixup2x-linux-amd64

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Подготовить assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false